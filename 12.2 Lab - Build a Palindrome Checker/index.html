<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Palindrome Checker</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Palindrome Checker</h1>
        </div>
        
        <div class="input-group">
            <p class="subtitle">Is your word or phrase a palindrome?</p>
            <input type="text" id="text-input" placeholder="Enter text here"/>
            <button id="check-btn">Check</button>
        </div>

        <p id="result">THIS IS TEMPORARY TEXT</p>

        <div class="info-box">
            <p>💡A <strong>palindrome</strong> is a word or sentence that reads the same forwards and backwards, ignoring punctuation, case, and spacing.</p>
        </div>

    </div>
<script src="script.js"></script>    
</body> 

</html>
